name: Release Build

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      checkout_ref:
        required: false
        type: string
        default: ""
      prerelease:
        required: false
        type: boolean
        default: false
      make_latest:
        required: false
        type: boolean
        default: true
      release_name:
        required: false
        type: string
        default: ""
      rolling_tag:
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  VERSIONS_PLUGIN: org.codehaus.mojo:versions-maven-plugin:2.16.2

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - id: vars
        name: Resolve workflow variables
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          CHECKOUT_REF: ${{ inputs.checkout_ref }}
          RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          set -euo pipefail

          checkout_ref="${CHECKOUT_REF:-$TAG}"
          release_name="${RELEASE_NAME:-Release $TAG}"

          echo "checkout_ref=$checkout_ref" >> "$GITHUB_OUTPUT"
          echo "release_name=$release_name" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.vars.outputs.checkout_ref }}
          fetch-depth: 0
          fetch-tags: true

      # Local builds keep the pom version (0.1.0-SNAPSHOT): the Docker stand refers to
      # jars by that name. Release builds stamp the version from the tag instead.
      - id: maven-version
        name: Resolve Maven version
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          ROLLING_TAG: ${{ inputs.rolling_tag }}
        run: |
          set -euo pipefail

          if [[ "$ROLLING_TAG" == "true" ]]; then
            git fetch origin '+refs/tags/*:refs/tags/*' --force
            version_tag="$(git tag --merged HEAD -l 'v[0-9]*' --sort=-v:refname | head -n1)"
            base="${version_tag#v}"
            if [[ -z "$base" ]]; then
              echo "No reachable release tag, using 0.0.0 as the nightly base version."
              base="0.0.0"
            fi
            version="${base}-$(git rev-parse --short=8 HEAD)"
          else
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release tag must look like vMAJOR.MINOR.PATCH, got: $TAG" >&2
              exit 1
            fi
            version="${TAG#v}"
          fi

          echo "Maven version: ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # The agent needs a full JDK 8 with lib/tools.jar.
      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Set Maven version
        env:
          VERSION: ${{ steps.maven-version.outputs.version }}
        run: mvn -B -q "${VERSIONS_PLUGIN}:set" -DnewVersion="$VERSION" -DgenerateBackupPoms=false

      # The agent and spark-jobs jars do not depend on the Hadoop line; block-mapper
      # does, so it ships once per profile. `clean` keeps shade from re-shading.
      - name: Build and test (hadoop-3.1.1)
        run: mvn -B clean verify -P hadoop-3.1.1

      - name: Stage block-mapper for hadoop-3.1.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp block-mapper/target/block-mapper-*-hadoop-3.1.1.jar dist/

      - name: Build and test (hadoop-3.3.6)
        run: mvn -B clean verify -P hadoop-3.3.6

      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for jar in agent/target/*.jar block-mapper/target/*.jar spark-jobs/target/*.jar; do
            # Skip the pre-shade jars kept by maven-shade-plugin.
            [[ "$(basename "$jar")" == original-* ]] && continue
            cp "$jar" dist/
          done
          cd dist
          count=$(find . -maxdepth 1 -name '*.jar' | wc -l)
          if (( count != 4 )); then
            echo "Expected 4 jars (agent, spark-jobs, block-mapper x2), got ${count}:" >&2
            ls -l >&2
            exit 1
          fi
          sha256sum ./*.jar > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: hadoop-traffic-${{ inputs.tag }}
          path: |
            dist/*.jar
            dist/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error

      - name: Move rolling tag
        if: ${{ inputs.rolling_tag }}
        env:
          TAG: ${{ inputs.tag }}
          REF: ${{ steps.vars.outputs.checkout_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin --tags --force
          git tag -f "$TAG" "$REF"
          git push origin "refs/tags/$TAG" --force

      - name: Delete old rolling assets
        if: ${{ inputs.rolling_tag }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Rolling release $TAG does not exist yet, nothing to clean."
            exit 0
          fi

          mapfile -t assets < <(gh release view "$TAG" --json assets --jq '.assets[].name')
          if (( ${#assets[@]} == 0 )); then
            echo "No old assets to delete."
            exit 0
          fi

          for asset in "${assets[@]}"; do
            echo "Deleting old asset: $asset"
            gh release delete-asset "$TAG" "$asset" --yes
          done

      - name: Install git-cliff
        env:
          GIT_CLIFF_VERSION: "2.13.1"
          GIT_CLIFF_SHA256: "9a1263f24e59a2f508c7b3d3283c9dea94a8bf697f96dbc18cc783cac6284546"
        run: |
          set -euo pipefail
          url="https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL "$url" -o /tmp/git-cliff.tar.gz
          echo "${GIT_CLIFF_SHA256}  /tmp/git-cliff.tar.gz" | sha256sum -c -
          tar -xzf /tmp/git-cliff.tar.gz -C /tmp
          sudo install "/tmp/git-cliff-${GIT_CLIFF_VERSION}/git-cliff" /usr/local/bin/git-cliff
          git-cliff --version

      - name: Generate release notes
        env:
          TAG: ${{ inputs.tag }}
        run: .github/scripts/gen-release-notes.sh "$TAG" release-notes.md

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          RELEASE_NAME: ${{ steps.vars.outputs.release_name }}
          PRERELEASE: ${{ inputs.prerelease }}
          MAKE_LATEST: ${{ inputs.make_latest }}
        run: |
          set -euo pipefail

          flags=(
            --title "${RELEASE_NAME}"
            --notes-file release-notes.md
          )
          if [[ "${PRERELEASE}" == "true" ]]; then
            flags+=(--prerelease)
          fi
          if [[ "${MAKE_LATEST}" == "true" ]]; then
            flags+=(--latest)
          else
            flags+=(--latest=false)
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Updating existing release ${TAG}..."
            gh release edit "${TAG}" "${flags[@]}"
            gh release upload "${TAG}" dist/*.jar dist/SHA256SUMS.txt --clobber
          else
            echo "Creating release ${TAG}..."
            gh release create "${TAG}" dist/*.jar dist/SHA256SUMS.txt "${flags[@]}"
          fi

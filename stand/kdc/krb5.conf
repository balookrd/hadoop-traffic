[libdefaults]
    default_realm = TRAFFIC.LOCAL
    dns_lookup_realm = false
    dns_lookup_kdc = false
    ticket_lifetime = 24h
    renew_lifetime = 7d
    forwardable = true
    rdns = false
    # TCP only: large service tickets do not fit into a UDP datagram.
    udp_preference_limit = 1
    # Java 8 does not know the aes-sha2 enctypes newer KDCs prefer.
    default_tkt_enctypes = aes256-cts-hmac-sha1-96 aes128-cts-hmac-sha1-96
    default_tgs_enctypes = aes256-cts-hmac-sha1-96 aes128-cts-hmac-sha1-96
    permitted_enctypes = aes256-cts-hmac-sha1-96 aes128-cts-hmac-sha1-96

[realms]
    TRAFFIC.LOCAL = {
        kdc = tr-kdc
        admin_server = tr-kdc
    }

[domain_realm]
    .traffic-net = TRAFFIC.LOCAL
    traffic-net = TRAFFIC.LOCAL
